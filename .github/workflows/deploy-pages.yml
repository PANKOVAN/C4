# Сборка и публикация LikeC4 на GitHub Pages
# Сайт: https://pankovan.github.io/C4/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        id: pages

      # В корне сайта — HTML из readme.md (GitHub Pages не отдаёт .md как стартовую страницу)
      - name: Build LikeC4, render README, assemble site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "" ]; then
            LIKEC4_BASE="/viewer/"
          else
            LIKEC4_BASE="${BASE_PATH}/viewer/"
          fi
          npx likec4@latest build --base "$LIKEC4_BASE" --output dist
          mkdir -p _site/viewer
          cp -a dist/. _site/viewer/
          pandoc readme.md -t html5 -s --metadata title="КИ-Ц САИ ПС.ИНП" -o _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
