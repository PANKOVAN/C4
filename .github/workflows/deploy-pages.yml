# Сборка и публикация LikeC4 на GitHub Pages
# Сайт: https://pankovan.github.io/C4/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        id: pages

      # В корне сайта — HTML из readme.md (GitHub Pages не отдаёт .md как стартовую страницу)
      - name: Build LikeC4, render README, assemble site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          # Base URL вьюера: /REPO/viewer/ для project pages (pankovan.github.io/REPO/…).
          # Если base_path с configure-pages пустой, часто ассеты уезжают на /viewer/… и 404.
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "" ]; then
            BP="${BASE_PATH}"
            [ "${BP#/}" = "$BP" ] && BP="/$BP"
            LIKEC4_BASE="${BP%/}/viewer/"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            LIKEC4_BASE="/viewer/"
          else
            LIKEC4_BASE="/${REPO_NAME}/viewer/"
          fi
          echo "LIKEC4_BASE=$LIKEC4_BASE (BASE_PATH from Pages=$BASE_PATH, repo=$REPO_NAME)"
          npx likec4@latest build \
            --base "$LIKEC4_BASE" \
            --use-hash-history \
            -t "КИ-Ц САИ ПС.ИНП" \
            --output dist
          mkdir -p _site
          # иначе Jekyll на github.io может портить отдачу статики
          touch _site/.nojekyll
          mkdir -p _site/viewer
          cp -a dist/. _site/viewer/
          # GitHub Pages: по несуществующему пути отдать SPA (глубокие ссылки без hash)
          cp _site/viewer/index.html _site/viewer/404.html
          if [ -d images ]; then mkdir -p _site/images; cp -a images/. _site/images/; fi
          REV="${GITHUB_SHA:-local}"
          REV_SHORT="${REV:0:7}"
          printf '<footer class="ghp-build"><p><small>Ревизия: %s</small></p></footer>\n' \
            "$REV_SHORT" > _pandoc_after_body.html
          pandoc readme.md -t html5 -s --metadata title="КИ-Ц САИ ПС.ИНП" \
            --include-in-header=.github/pandoc-head.html \
            --include-after-body=_pandoc_after_body.html \
            -o _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
